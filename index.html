<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MatizJ Spreadsheet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">

<!-- ═══════════════════════════════════════════════════════════════
     ✏️  TOUT CE QUE TU PEUX MODIFIER EST DANS LE BLOC <script> CI-DESSOUS
     (tout en haut : SITE, CATEGORIES, PRODUCTS)
     ═══════════════════════════════════════════════════════════════ -->

<style>
:root{
  --bg:#121212; --surface:#1e1e1e; --surface2:#2a2a2a; --border:#333;
  --fg:#f0f0f0; --fg2:#aaa; --accent:#cc1111; --accent-hover:#ff2222; --nav-bg:#0d0d0d;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:inherit;text-decoration:none}

/* NAV */
.nav{background:var(--nav-bg);border-bottom:3px solid var(--accent);display:flex;align-items:center;justify-content:center;padding:16px max(16px,env(safe-area-inset-left,0px));position:relative}
.logo{font-size:1.5rem;font-weight:800;letter-spacing:.06em;color:#fff;text-transform:uppercase}
.logo .j{color:var(--accent)}
.hamburger{display:flex;flex-direction:column;gap:5px;cursor:pointer;padding:6px;background:none;border:none}
.hamburger span{display:block;width:24px;height:2px;background:var(--fg)}
.menu{position:absolute;right:12px;top:100%;margin-top:6px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:6px;z-index:60;min-width:200px}
.menu[hidden]{display:none}
.menu a{display:block;padding:11px 14px;border-radius:8px;font-weight:600;font-size:.9rem}
.menu a:hover{background:var(--surface2);color:var(--accent)}

/* HERO */
.hero{background:#0d0d0d;padding:36px max(16px,env(safe-area-inset-left,0px)) 28px;text-align:center;border-bottom:1px solid var(--border)}
.hero h1{font-size:clamp(1.6rem,6vw,2.4rem);font-weight:800;color:var(--accent);line-height:1.2;text-wrap:balance}

/* HOW TO BUY */
.htb-tab{position:fixed;right:0;top:50%;transform:translateY(-50%);background:var(--accent);color:#fff;writing-mode:vertical-rl;padding:14px 8px;font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;border-radius:6px 0 0 6px;z-index:50}

/* FILTRES */
.filter-box{background:var(--surface2);border-radius:16px;margin:20px max(16px,env(safe-area-inset-left,0px));padding:16px}
.search-input{width:100%;background:#1a1a1a;border:1px solid var(--border);color:var(--fg);padding:12px 16px;border-radius:10px;font-size:.95rem;font-family:inherit;outline:none;margin-bottom:14px}
.search-input::placeholder{color:var(--fg2)}
.search-input:focus{border-color:var(--accent)}
.cats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.cat-pill{background:var(--surface);border:1.5px solid var(--border);color:var(--fg);padding:7px 16px;border-radius:999px;font-size:.82rem;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;transition:all .15s}
.cat-pill.active{background:var(--accent);border-color:var(--accent);color:#fff}
.cat-pill:hover:not(.active){border-color:var(--accent);color:var(--accent)}
.sort-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sort-label{font-size:.75rem;font-weight:700;letter-spacing:.1em;color:var(--fg2);text-transform:uppercase}
.sort-pill{background:transparent;border:1.5px solid var(--border);color:var(--fg2);padding:6px 16px;border-radius:999px;font-size:.82rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.sort-pill.active{border-color:var(--accent);color:var(--accent)}
.sort-pill:hover:not(.active){border-color:var(--fg2);color:var(--fg)}

/* GRILLE */
.grid-wrap{padding:0 max(16px,env(safe-area-inset-left,0px)) 40px;max-width:1100px;margin:0 auto}
.product-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(min-width:700px){.product-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1000px){.product-grid{grid-template-columns:repeat(4,1fr)}}

/* CARTE (clic = ouvre le lien du produit) */
.card{display:block;background:var(--surface);border-radius:14px;overflow:hidden;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(204,17,17,.18)}
.card-img{position:relative;aspect-ratio:1;background:#fff;overflow:hidden}
.card-img img{width:100%;height:100%;object-fit:contain;display:block}
.badge{position:absolute;top:8px;left:8px;background:var(--accent);color:#fff;font-size:.7rem;font-weight:700;padding:4px 10px;border-radius:999px}
.card-body{padding:12px 12px 14px}
.card-name{font-size:.9rem;font-weight:700;line-height:1.3;margin-bottom:8px}
.card-price{font-size:1.1rem;font-weight:800;color:var(--accent);margin-bottom:8px;font-variant-numeric:tabular-nums}
.card-cat{font-size:.75rem;color:var(--fg2);margin-bottom:8px}
.card-note{font-size:.78rem;font-style:italic;color:var(--fg2);border-left:3px solid var(--border);padding-left:8px}
.card:hover .empty{grid-column:1/-1;text-align:center;color:var(--fg2);padding:40px 0;font-size:.9rem}
</style>
</head>
<body>

<nav class="nav">
  <a href="#" class="logo">Matiz<span class="j">J</span></a>
</nav>

<section class="hero">
  <h1 id="siteTitle"></h1>
</section>

<a href="#" class="htb-tab" id="htb" target="_blank" rel="noopener">HOW TO BUY</a>

<div class="filter-box">
  <input class="search-input" type="text" id="searchInput" placeholder="Search MatizJ reps, brands, categories... (e.g. Nike, Shoes)">
  <div class="cats" id="cats"></div>
  <div class="sort-row">
    <span class="sort-label">Sort</span>
    <button class="sort-pill active" data-sort="default">Trending</button>
    <button class="sort-pill" data-sort="price-desc">Price ↑</button>
    <button class="sort-pill" data-sort="price-asc">Price ↓</button>
    <button class="sort-pill" data-sort="az">A → Z</button>
  </div>
</div>

<div class="grid-wrap">
  <div class="product-grid" id="productGrid"></div>
</div>

<script>
/* ════════════════════════════════════════════════════════════════
   1) RÉGLAGES DU SITE  — modifie les textes ici
   ════════════════════════════════════════════════════════════════ */
const SITE = {
  title: "MatizJ Spreadsheet — Best Reps & QC Database",
  currency: "€",            // "€", "$", etc.
  currencyBefore: false,    // false → "14 €"   |   true → "$14"
  howToBuyUrl: "https://example.com",   // lien du bouton rouge "HOW TO BUY" sur le côté

  // Liens du menu (les 3 barres en haut à droite) — ajoute / supprime des lignes
  links: [
    { text: "📚 TUTO commander", url: "https://example.com" },
    { text: "🙋 AIDE",           url: "https://example.com" }
  ]
};

/* ════════════════════════════════════════════════════════════════
   2) CATÉGORIES  — "id" = ce que tu écris dans "cat" des produits
   ════════════════════════════════════════════════════════════════ */
const CATEGORIES = [
  { id: "all",         label: "All Products" },
  { id: "shoes",       label: "Shoes" },
  { id: "pants",       label: "Pants" },
  { id: "short",       label: "Short" },
  { id: "tshirts",     label: "T-shirts" },
  { id: "sweaters",    label: "Pull" },
  { id: "vestes",       label: "Veste / Doudoune" },
  { id: "accessories", label: "Accessories" }
];

/* ════════════════════════════════════════════════════════════════
   3) PRODUITS  — copie/colle un bloc { ... }, modifie, et c'est tout !
   ────────────────────────────────────────────────────────────────
   name  : nom affiché
   price : prix (nombre, ex: 14 ou 12.5)
   cat   : une catégorie de la liste du dessus (shoes, pants, short,
           tshirts, sweaters, vestes, accessories)
   image : lien d'une image (https://...) OU chemin d'un fichier mis
           sur GitHub (ex: "images/veste.jpg"). Vide = image par défaut.
   link  : lien du produit (AliExpress, Taobao, 1688, lovegobuy...)
   note  : petit texte (ex: la taille) — optionnel, peut être ""
   top   : true = badge ⭐ TOP — optionnel
   ════════════════════════════════════════════════════════════════ */
const PRODUCTS = [
  {
    name: "Veste en jean",
    price: 14,
    cat: "vestes",
    image: "",
    link: "https://www.aliexpress.com/",
    note: "",
    top: true
  },
  {
    name: "Jean",
    price: 10,
    cat: "pants",
    image: "",
    link: "https://www.aliexpress.com/",
    note: "",
    top: true
  },
  {
    name: "T-shirt basic",
    price: 6,
    cat: "tshirts",
    image: "",
    link: "https://www.aliexpress.com/",
    note: "",
    top: false
  }
];

/* ════════════════════════════════════════════════════════════════
   ⚠️ NE PAS TOUCHER EN DESSOUS (sauf si tu sais coder)
   ════════════════════════════════════════════════════════════════ */
const PLACEHOLDER = "data:image/svg+xml;utf8," + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" fill="#f2f2f2"/>' +
  '<text x="100" y="108" font-family="sans-serif" font-size="14" fill="#999" text-anchor="middle">Pas d\'image</text></svg>');

let currentCat = "all", currentSort = "default", query = "";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtPrice = n => {
  const v = Number.isInteger(n) ? n : n.toFixed(2);
  return SITE.currencyBefore ? SITE.currency + v : v + " " + SITE.currency;
};
const catLabel = id => (CATEGORIES.find(c => c.id === id) || {label: id}).label;

// En-tête
$("siteTitle").textContent = SITE.title;
document.title = "MatizJ Spreadsheet";
$("htb").href = SITE.howToBuyUrl;

// Catégories
$("cats").innerHTML = CATEGORIES.map(c =>
  `<button class="cat-pill ${c.id === "all" ? "active" : ""}" data-cat="${esc(c.id)}">${esc(c.label)}</button>`).join("");

function getFiltered() {
  const q = query.toLowerCase();
  const list = PRODUCTS.filter(p =>
    (currentCat === "all" || p.cat === currentCat) &&
    (!q || p.name.toLowerCase().includes(q) || catLabel(p.cat).toLowerCase().includes(q)));
  if (currentSort === "price-asc") list.sort((a, b) => a.price - b.price);
  else if (currentSort === "price-desc") list.sort((a, b) => b.price - a.price);
  else if (currentSort === "az") list.sort((a, b) => a.name.localeCompare(b.name));
  return list;
}

function render() {
  const grid = $("productGrid");
  const list = getFiltered();
  if (!list.length) { grid.innerHTML = '<p class="empty">Aucun produit trouvé.</p>'; return; }
  grid.innerHTML = list.map(p => `
    <a class="card" href="${esc(p.link || "#")}" target="_blank" rel="noopener noreferrer">
      <div class="card-img">
        ${p.top ? '<span class="badge">⭐ TOP</span>' : ""}
        <img src="${esc(p.image || PLACEHOLDER)}" alt="${esc(p.name)}" loading="lazy" referrerpolicy="no-referrer"
             onerror="this.onerror=null;this.src='${PLACEHOLDER.replace(/'/g, "\\'")}'">
      </div>
      <div class="card-body">
        <div class="card-name">${esc(p.name)}</div>
        <div class="card-price">${fmtPrice(p.price)}</div>
        <div class="card-cat">🏷 ${esc(catLabel(p.cat))}</div>
        ${p.note ? `<div class="card-note">${esc(p.note)}</div>` : ""}
      </div>
    </a>`).join("");
}

$("cats").addEventListener("click", e => {
  const b = e.target.closest(".cat-pill"); if (!b) return;
  document.querySelectorAll(".cat-pill").forEach(x => x.classList.remove("active"));
  b.classList.add("active"); currentCat = b.dataset.cat; render();
});
document.querySelectorAll(".sort-pill").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".sort-pill").forEach(x => x.classList.remove("active"));
  b.classList.add("active"); currentSort = b.dataset.sort; render();
}));
let t; $("searchInput").addEventListener("input", e => {
  clearTimeout(t); t = setTimeout(() => { query = e.target.value; render(); }, 150);
});

render();
</script>
</body>
</html>
